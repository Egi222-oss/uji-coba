<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak Pro - Pengelola Kontak Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 text-slate-900">

    <div class="max-w-5xl mx-auto">
        <header class="mb-10 text-center md:text-left">
            <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">Buku Kontak Digital</h1>
            <p class="text-slate-500">Kelola data kolega dan keluarga dengan mudah & aman.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 sticky top-8">
                    <h2 class="text-lg font-bold mb-6 flex items-center gap-2">
                        <i data-lucide="user-plus" class="text-blue-600"></i> Tambah Kontak Baru
                    </h2>
                    <form id="contactForm" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-400 mb-1 ml-1">Nama Lengkap</label>
                            <input type="text" id="name" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all" placeholder="Nama lengkap...">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-400 mb-1 ml-1">Nomor Telepon</label>
                            <input type="tel" id="phone" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all" placeholder="0812345678...">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-400 mb-1 ml-1">Email</label>
                            <input type="email" id="email" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all" placeholder="email@contoh.com">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-400 mb-1 ml-1">Lokasi</label>
                            <input type="text" id="location" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all" placeholder="Kota, Negara">
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-2xl transition-all shadow-lg shadow-blue-100 flex items-center justify-center gap-2 mt-4 active:scale-[0.98]">
                            <i data-lucide="save" class="w-5 h-5"></i> Simpan Kontak
                        </button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                    
                    <div class="p-5 border-b border-slate-100 flex flex-col md:flex-row gap-4 items-center justify-between bg-white">
                        <div class="relative flex-1 w-full">
                            <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
                            <input type="text" id="searchInput" class="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="Cari nama, email, atau lokasi...">
                        </div>
                        <button id="deleteAllBtn" class="hidden px-5 py-3 text-sm font-bold text-red-600 hover:bg-red-50 rounded-2xl transition-all flex items-center gap-2 border border-transparent hover:border-red-100">
                            <i data-lucide="trash-2" class="w-4 h-4"></i> Hapus Semua
                        </button>
                    </div>

                    <div id="contactList" class="divide-y divide-slate-100 min-h-[300px]">
                        </div>

                    <div id="emptyState" class="hidden p-20 text-center">
                        <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="users" class="w-10 h-10 text-slate-300"></i>
                        </div>
                        <h3 class="text-slate-800 font-bold text-lg">Tidak ada kontak</h3>
                        <p class="text-slate-500">Silakan tambahkan kontak baru melalui form.</p>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
