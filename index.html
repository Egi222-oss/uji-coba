<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Kontak Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <header class="mb-8 text-center md:text-left">
            <h1 class="text-3xl font-extrabold text-slate-800">Address Book</h1>
            <p class="text-slate-500">Tempat Menyimpan Kontak Anda.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 sticky top-8">
                    <h2 class="text-lg font-bold mb-5 text-slate-700 flex items-center gap-2">
                        <i data-lucide="user-plus" class="w-5 h-5 text-blue-600"></i> Tambah Kontak
                    </h2>
                    <form class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Nama Lengkap</label>
                            <input type="text" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition" placeholder="Contoh: Egi Munandar">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Nomor Telepon</label>
                            <input type="tel" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition" placeholder="0821...">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Email</label>
                            <input type="email" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition" placeholder="egi77@email.com">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Lokasi / Alamat</label>
                            <input type="text" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition" placeholder="Sambas, Indonesia">
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-blue-200 flex items-center justify-center gap-2 mt-2">
                            <i data-lucide="save" class="w-5 h-5"></i> Simpan Kontak
                        </button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    
                    <div class="p-5 border-b border-slate-100">
                        <div class="relative">
                            <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
                            <input type="text" class="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Cari berdasarkan nama, email, atau lokasi...">
                        </div>
                    </div>

                    <div class="divide-y divide-slate-100">
                        <div class="p-6 flex flex-col sm:flex-row sm:items-center justify-between hover:bg-slate-50 transition gap-4">
                            <div class="flex items-start gap-4">
                                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 text-white flex items-center justify-center font-bold text-lg shrink-0 shadow-md">
                                    BS
                                </div>
                                <div class="space-y-1">
                                    <h3 class="font-bold text-slate-800 text-lg">Egi Munandar</h3>
                                    <div class="flex flex-wrap gap-x-4 gap-y-1 text-sm text-slate-500">
                                        <span class="flex items-center gap-1.5"><i data-lucide="phone" class="w-3.5 h-3.5"></i> +62 821 234 567</span>
                                        <span class="flex items-center gap-1.5"><i data-lucide="mail" class="w-3.5 h-3.5"></i> egi77@email.com</span>
                                        <span class="flex items-center gap-1.5 text-blue-600 font-medium"><i data-lucide="map-pin" class="w-3.5 h-3.5 text-blue-600"></i> Sambas, ID</span>
                                    </div>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button class="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition border border-transparent hover:border-red-100" title="Hapus">
                                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>

                        <div class="p-5 border-b border-slate-100 flex flex-col md:flex-row gap-4 items-center justify-between">
                           <div class="relative flex-1 w-full">
                              <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>

                              <input type="text" id="searchInput" class="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Cari kontak...">
                           </div>
                           <button id="deleteAllBtn" class="px-4 py-3 text-sm font-bold text-red-600 hover:bg-red-50 rounded-2xl transition flex items-center gap-2 shrink-0 border border-transparent hover:border-red-100">
                              <i data-lucide="trash-2" class="w-4 h-4"></i> Hapus Semua
                           </button>
                        </div>

                        <div class="p-6 flex flex-col sm:flex-row sm:items-center justify-between hover:bg-slate-50 transition gap-4">
                            <div class="flex items-start gap-4">
                                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-purple-500 to-pink-600 text-white flex items-center justify-center font-bold text-lg shrink-0 shadow-md">
                                    SP
                                </div>
                                <div class="space-y-1">
                                    <h3 class="font-bold text-slate-800 text-lg">Alexa</h3>
                                    <div class="flex flex-wrap gap-x-4 gap-y-1 text-sm text-slate-500">
                                        <span class="flex items-center gap-1.5"><i data-lucide="phone" class="w-3.5 h-3.5"></i> +62 855 112 233</span>
                                        <span class="flex items-center gap-1.5"><i data-lucide="mail" class="w-3.5 h-3.5"></i> Alexa@web.com</span>
                                        <span class="flex items-center gap-1.5 text-blue-600 font-medium"><i data-lucide="map-pin" class="w-3.5 h-3.5"></i> California, USA</span>
                                    </div>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button class="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition border border-transparent hover:border-red-100" title="Hapus">
                                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script> src= "script.js"</script>
</body>
</html>
